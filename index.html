<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CodeMatch — Programming Memory Game</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Inter, Arial, sans-serif;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, #243b70 0, transparent 35%),
        radial-gradient(circle at bottom right, #4b206b 0, transparent 35%),
        #090d1a;
      color: #ffffff;
      padding: 30px 20px;
    }

    /* =========================
       MAIN CONTAINER
    ========================= */

    .container {
      width: min(1200px, 100%);
      margin: auto;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 30px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-icon {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
      background: linear-gradient(135deg, #6c63ff, #a855f7);
      box-shadow: 0 10px 30px rgba(108, 99, 255, 0.3);
    }

    .brand h1 {
      font-size: 25px;
      letter-spacing: -0.5px;
    }

    .brand p {
      color: #9299b5;
      font-size: 13px;
      margin-top: 3px;
    }

    .player-badge {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.09);
      padding: 9px 15px 9px 9px;
      border-radius: 30px;
    }

    .player-avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #6c63ff;
      font-weight: bold;
      font-size: 14px;
    }

    .player-info small {
      display: block;
      color: #777f9d;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .player-info span {
      font-size: 14px;
      font-weight: 600;
    }

    /* =========================
       CONTROL PANEL
    ========================= */

    .control-panel {
      background: rgba(255, 255, 255, 0.055);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 22px;
      padding: 20px;
      backdrop-filter: blur(20px);
      margin-bottom: 20px;
    }

    .control-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .difficulty-wrapper label {
      display: block;
      color: #8c94b0;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      margin-bottom: 8px;
    }

    .difficulty-options {
      display: flex;
      gap: 8px;
    }

    .difficulty-btn {
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.04);
      color: #aeb5ce;
      padding: 10px 17px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 13px;
      transition: 0.2s;
    }

    .difficulty-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: white;
    }

    .difficulty-btn.active {
      background: #6c63ff;
      border-color: #6c63ff;
      color: white;
      box-shadow: 0 7px 20px rgba(108, 99, 255, 0.25);
    }

    .start-btn {
      border: none;
      padding: 12px 22px;
      border-radius: 11px;
      background: linear-gradient(135deg, #6c63ff, #8b5cf6);
      color: white;
      font-weight: 700;
      cursor: pointer;
      font-size: 14px;
      transition: 0.2s;
    }

    .start-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(108, 99, 255, 0.3);
    }

    /* =========================
       STATS
    ========================= */

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 22px;
    }

    .stat-card {
      background: rgba(255, 255, 255, 0.045);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 17px;
      padding: 17px;
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .stat-icon {
      width: 40px;
      height: 40px;
      border-radius: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(108, 99, 255, 0.13);
      font-size: 18px;
    }

    .stat-card small {
      color: #777f9d;
      display: block;
      font-size: 11px;
      margin-bottom: 3px;
      text-transform: uppercase;
      letter-spacing: 0.7px;
    }

    .stat-card strong {
      font-size: 21px;
    }

    /* =========================
       GAME AREA
    ========================= */

    .game-section {
      background: rgba(255, 255, 255, 0.035);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 25px;
      padding: 28px;
      min-height: 400px;
    }

    .game-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .game-heading h2 {
      font-size: 17px;
    }

    .game-heading span {
      color: #737b98;
      font-size: 12px;
    }

    /* =========================
       BOARD
    ========================= */

    .game-board {
      display: grid;
      gap: 12px;
      justify-content: center;
      margin: auto;
    }

    .card {
      width: 78px;
      height: 78px;
      position: relative;
      cursor: pointer;
      perspective: 700px;
    }

    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.45s ease;
      transform-style: preserve-3d;
    }

    .card.flipped .card-inner,
    .card.matched .card-inner {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 15px;
      backface-visibility: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-front {
      background: linear-gradient(145deg, #171e35, #11162a);
      border: 1px solid rgba(255, 255, 255, 0.09);
      box-shadow:
        0 8px 20px rgba(0, 0, 0, 0.2),
        inset 0 1px rgba(255, 255, 255, 0.04);
    }

    .card-front::before {
      content: "</>";
      font-size: 17px;
      font-weight: 800;
      color: #505a80;
    }

    .card:hover .card-front {
      border-color: rgba(108, 99, 255, 0.6);
      transform: translateY(-2px);
    }

    .card-back {
      background: #ffffff;
      transform: rotateY(180deg);
      padding: 13px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.25);
    }

    .card-back img {
      width: 65%;
      height: 65%;
      object-fit: contain;
    }

    .card.matched .card-back {
      border: 3px solid #36d399;
      box-shadow: 0 0 20px rgba(54, 211, 153, 0.25);
    }

    /* =========================
       MESSAGE
    ========================= */

    #message {
      text-align: center;
      margin-top: 22px;
      min-height: 25px;
      font-size: 15px;
      color: #62e6ad;
      font-weight: 600;
    }

    /* =========================
       LEADERBOARD
    ========================= */

    #leaderboard {
      margin-top: 25px;
      background: rgba(255, 255, 255, 0.035);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 22px;
      padding: 24px;
    }

    .leaderboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .leaderboard-header h2 {
      font-size: 17px;
    }

    .leaderboard-header span {
      color: #777f9d;
      font-size: 11px;
      text-transform: uppercase;
    }

    #leaderboard table {
      width: 100%;
      border-collapse: collapse;
    }

    #leaderboard th {
      color: #686f8b;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      text-align: left;
      padding: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.07);
    }

    #leaderboard td {
      padding: 13px 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      color: #c5c9d8;
      font-size: 13px;
    }

    #leaderboard tr:last-child td {
      border-bottom: none;
    }

    #leaderboard td:nth-child(2) {
      color: #8f85ff;
      font-weight: 700;
    }

    /* =========================
       WIN MODAL
    ========================= */

    .win-overlay {
      position: fixed;
      inset: 0;
      background: rgba(4, 6, 15, 0.78);
      backdrop-filter: blur(10px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }

    .win-modal {
      width: min(430px, 100%);
      background: #11172b;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 25px;
      padding: 35px;
      text-align: center;
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.5);
      animation: popup 0.35s ease;
    }

    @keyframes popup {
      from {
        opacity: 0;
        transform: scale(0.9) translateY(15px);
      }

      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .win-icon {
      font-size: 50px;
      margin-bottom: 15px;
    }

    .win-modal h2 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    .win-modal p {
      color: #858ca7;
      font-size: 14px;
      margin-bottom: 25px;
    }

    .score-box {
      background: rgba(108, 99, 255, 0.09);
      border: 1px solid rgba(108, 99, 255, 0.2);
      border-radius: 15px;
      padding: 17px;
      margin-bottom: 20px;
    }

    .score-box small {
      color: #777f9d;
      text-transform: uppercase;
      font-size: 10px;
      letter-spacing: 1px;
    }

    .score-box strong {
      display: block;
      color: #9b92ff;
      font-size: 34px;
      margin-top: 5px;
    }

    .win-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 22px;
    }

    .win-stat {
      background: rgba(255, 255, 255, 0.045);
      padding: 13px;
      border-radius: 12px;
    }

    .win-stat small {
      display: block;
      color: #737b98;
      font-size: 10px;
      text-transform: uppercase;
    }

    .win-stat strong {
      font-size: 17px;
    }

    .play-again {
      width: 100%;
      border: none;
      padding: 13px;
      border-radius: 11px;
      background: linear-gradient(135deg, #6c63ff, #8b5cf6);
      color: white;
      font-weight: 700;
      cursor: pointer;
      font-size: 14px;
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 700px) {

      body {
        padding: 18px 12px;
      }

      header {
        align-items: flex-start;
      }

      .brand h1 {
        font-size: 20px;
      }

      .player-badge {
        padding-right: 10px;
      }

      .player-info {
        display: none;
      }

      .control-top {
        flex-direction: column;
        align-items: stretch;
      }

      .difficulty-options {
        width: 100%;
      }

      .difficulty-btn {
        flex: 1;
        padding: 10px 5px;
      }

      .start-btn {
        width: 100%;
      }

      .stats {
        gap: 7px;
      }

      .stat-card {
        padding: 12px;
        flex-direction: column;
        text-align: center;
        gap: 6px;
      }

      .stat-icon {
        width: 34px;
        height: 34px;
      }

      .stat-card strong {
        font-size: 17px;
      }

      .game-section {
        padding: 15px 8px 25px;
      }

      .game-board {
        gap: 7px;
      }

      .card {
        width: min(17vw, 65px);
        height: min(17vw, 65px);
      }

      .card-front::before {
        font-size: 13px;
      }

      #leaderboard {
        padding: 15px;
        overflow-x: auto;
      }
    }

    @media (max-width: 400px) {

      .brand-icon {
        width: 43px;
        height: 43px;
        font-size: 20px;
      }

      .card {
        width: 16vw;
        height: 16vw;
      }

      .game-board {
        gap: 5px;
      }

      .stat-card small {
        font-size: 9px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- HEADER -->
    <header>

      <div class="brand">
        <div class="brand-icon">⌘</div>

        <div>
          <h1>CodeMatch</h1>
          <p>Programming Memory Challenge</p>
        </div>
      </div>

      <div class="player-badge">
        <div class="player-avatar" id="playerAvatar">P</div>

        <div class="player-info">
          <small>Player</small>
          <span id="playerName">Player</span>
        </div>
      </div>

    </header>


    <!-- CONTROLS -->
    <div class="control-panel">

      <div class="control-top">

        <div class="difficulty-wrapper">

          <label>Choose Difficulty</label>

          <div class="difficulty-options">

            <button class="difficulty-btn"
                    data-level="easy"
                    onclick="selectDifficulty('easy')">
              Easy
            </button>

            <button class="difficulty-btn"
                    data-level="medium"
                    onclick="selectDifficulty('medium')">
              Medium
            </button>

            <button class="difficulty-btn active"
                    data-level="hard"
                    onclick="selectDifficulty('hard')">
              Hard
            </button>

          </div>

        </div>

        <button class="start-btn" onclick="startGame()">
          ↻ New Game
        </button>

      </div>

    </div>


    <!-- STATS -->
    <div class="stats">

      <div class="stat-card">

        <div class="stat-icon">⏱</div>

        <div>
          <small>Time</small>
          <strong><span id="timer">0</span>s</strong>
        </div>

      </div>


      <div class="stat-card">

        <div class="stat-icon">↗</div>

        <div>
          <small>Attempts</small>
          <strong id="attempts">0</strong>
        </div>

      </div>


      <div class="stat-card">

        <div class="stat-icon">◆</div>

        <div>
          <small>Pairs</small>
          <strong id="pairsCount">16</strong>
        </div>

      </div>

    </div>


    <!-- GAME -->
    <section class="game-section">

      <div class="game-heading">

        <h2>Match the Technologies</h2>

        <span id="gameStatus">Ready to play</span>

      </div>

      <div class="game-board" id="board"></div>

      <p id="message"></p>

    </section>


    <!-- LEADERBOARD -->
    <div id="leaderboard"></div>

  </div>


  <!-- WIN MODAL -->
  <div class="win-overlay" id="winOverlay">

    <div class="win-modal">

      <div class="win-icon">🏆</div>

      <h2>Game Complete!</h2>

      <p id="winMessage">Great job!</p>

      <div class="score-box">

        <small>Your Score</small>

        <strong id="finalScore">0</strong>

      </div>

      <div class="win-stats">

        <div class="win-stat">
          <small>Attempts</small>
          <strong id="finalAttempts">0</strong>
        </div>

        <div class="win-stat">
          <small>Time</small>
          <strong id="finalTime">0s</strong>
        </div>

      </div>

      <button class="play-again" onclick="closeWinAndRestart()">
        Play Again
      </button>

    </div>

  </div>


  <script>

    /* =========================================
       GAME DATA
    ========================================= */

    const allIcons = [
      'python',
      'java',
      'c',
      'cpp',
      'html',
      'css',
      'js',
      'react',
      'r',
      'tableau',
      'powerbi',
      'sql',
      'swift',
      'go',
      'php'
    ];


    /* =========================================
       VARIABLES
    ========================================= */

    const board = document.getElementById('board');
    const timerEl = document.getElementById('timer');
    const attemptsEl = document.getElementById('attempts');
    const pairsCountEl = document.getElementById('pairsCount');
    const leaderboardEl = document.getElementById('leaderboard');
    const messageEl = document.getElementById('message');
    const gameStatus = document.getElementById('gameStatus');

    let flipped = [];
    let matched = [];

    let attempts = 0;
    let timer = 0;

    let interval = null;
    let gameStarted = false;

    let difficulty = 'hard';

    let player =
      prompt("Enter your name:")?.trim() || "Player";


    document.getElementById("playerName").textContent = player;

    document.getElementById("playerAvatar").textContent =
      player.charAt(0).toUpperCase();


    /* =========================================
       DIFFICULTY
    ========================================= */

    function selectDifficulty(level) {

      difficulty = level;

      document.querySelectorAll('.difficulty-btn')
        .forEach(button => {
          button.classList.remove('active');
        });

      document
        .querySelector(`[data-level="${level}"]`)
        .classList.add('active');

      startGame();
    }


    /* =========================================
       SHUFFLE
    ========================================= */

    function shuffle(arr) {

      for (let i = arr.length - 1; i > 0; i--) {

        const j = Math.floor(Math.random() * (i + 1));

        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
    }


    /* =========================================
       GET PAIRS
    ========================================= */

    function getPairs(level) {

      if (level === 'easy') {
        return 6;
      }

      if (level === 'medium') {
        return 10;
      }

      return 14;
    }


    /* =========================================
       START GAME
    ========================================= */

    function startGame() {

      clearInterval(interval);

      const pairCount = getPairs(difficulty);

      const selectedIcons =
        allIcons.slice(0, pairCount);

      const cards =
        [...selectedIcons, ...selectedIcons];

      shuffle(cards);


      /* RESET */

      board.innerHTML = '';

      flipped = [];
      matched = [];

      attempts = 0;
      timer = 0;

      gameStarted = false;

      timerEl.textContent = timer;
      attemptsEl.textContent = attempts;
      pairsCountEl.textContent = pairCount;

      messageEl.textContent = '';

      gameStatus.textContent = 'Ready to play';


      /* BOARD SIZE */

      const columns =
        Math.ceil(Math.sqrt(cards.length));

      board.style.gridTemplateColumns =
        `repeat(${columns}, minmax(0, 78px))`;


      /* CREATE CARDS */

      cards.forEach((icon, index) => {

        const card = document.createElement('div');

        card.className = 'card';

        card.dataset.icon = icon;

        card.dataset.index = index;


        const inner =
          document.createElement('div');

        inner.className = 'card-inner';


        /* FRONT */

        const front =
          document.createElement('div');

        front.className =
          'card-face card-front';


        /* BACK */

        const back =
          document.createElement('div');

        back.className =
          'card-face card-back';


        const img =
          document.createElement('img');

        img.src = `images/${icon}.png`;

        img.alt = icon;


        back.appendChild(img);

        inner.appendChild(front);

        inner.appendChild(back);

        card.appendChild(inner);

        card.onclick = () => flipCard(card);

        board.appendChild(card);

      });

      showLeaderboard();
    }


    /* =========================================
       FLIP CARD
    ========================================= */

    function flipCard(card) {

      /* Start timer on first move */

      if (!gameStarted) {

        interval = setInterval(() => {

          timer++;

          timerEl.textContent = timer;

        }, 1000);

        gameStarted = true;

        gameStatus.textContent = 'Game in progress';

      }


      const index = card.dataset.index;


      /* Ignore invalid moves */

      if (
        flipped.includes(index) ||
        matched.includes(index) ||
        flipped.length === 2
      ) {
        return;
      }


      card.classList.add('flipped');

      flipped.push(index);


      /* Check pair */

      if (flipped.length === 2) {

        attempts++;

        attemptsEl.textContent = attempts;


        const [i1, i2] = flipped;

        const c1 = board.children[i1];

        const c2 = board.children[i2];


        /* MATCH */

        if (
          c1.dataset.icon ===
          c2.dataset.icon
        ) {

          matched.push(i1, i2);

          c1.classList.add('matched');

          c2.classList.add('matched');

          flipped = [];


          /* WIN */

          if (
            matched.length ===
            board.children.length
          ) {

            clearInterval(interval);

            showWin();

          }

        }

        /* NOT MATCH */

        else {

          setTimeout(() => {

            c1.classList.remove('flipped');

            c2.classList.remove('flipped');

            flipped = [];

          }, 750);

        }

      }

    }


    /* =========================================
       CALCULATE SCORE
    ========================================= */

    function calculateScore() {

      return Math.max(
        0,
        1000 -
        (attempts * 10 + timer)
      );

    }


    /* =========================================
       SHOW WIN
    ========================================= */

    function showWin() {

      const score = calculateScore();


      gameStatus.textContent =
        'Challenge completed';

      messageEl.textContent =
        `Excellent work, ${player}!`;


      saveScore(
        player,
        score,
        attempts,
        timer
      );


      /* MODAL */

      document.getElementById('finalScore')
        .textContent = score;

      document.getElementById('finalAttempts')
        .textContent = attempts;

      document.getElementById('finalTime')
        .textContent = `${timer}s`;

      document.getElementById('winMessage')
        .textContent =
        `${player}, you matched every technology!`;


      document.getElementById('winOverlay')
        .style.display = 'flex';


      showLeaderboard();

    }


    /* =========================================
       CLOSE WIN + RESTART
    ========================================= */

    function closeWinAndRestart() {

      document.getElementById('winOverlay')
        .style.display = 'none';

      startGame();

    }


    /* =========================================
       SAVE SCORE
    ========================================= */

    function saveScore(
      name,
      score,
      attempts,
      time
    ) {

      const key =
        `leaderboard-${difficulty}`;

      let scores =
        JSON.parse(
          localStorage.getItem(key)
        ) || [];


      scores.push({
        name,
        score,
        attempts,
        time
      });


      scores.sort(
        (a, b) => b.score - a.score
      );


      scores =
        scores.slice(0, 5);


      localStorage.setItem(
        key,
        JSON.stringify(scores)
      );

    }


    /* =========================================
       LEADERBOARD
    ========================================= */

    function showLeaderboard() {

      const key =
        `leaderboard-${difficulty}`;

      const scores =
        JSON.parse(
          localStorage.getItem(key)
        ) || [];


      leaderboardEl.innerHTML = `

        <div class="leaderboard-header">

          <h2>🏆 Leaderboard</h2>

          <span>
            Top 5 · ${difficulty.toUpperCase()}
          </span>

        </div>

      `;


      if (scores.length === 0) {

        leaderboardEl.innerHTML += `

          <p style="
            text-align:center;
            color:#707894;
            font-size:13px;
            padding:15px;
          ">
            No scores yet. Be the first!
          </p>

        `;

        return;
      }


      const table =
        document.createElement('table');


      table.innerHTML = `

        <tr>
          <th>#</th>
          <th>Player</th>
          <th>Score</th>
          <th>Attempts</th>
          <th>Time</th>
        </tr>

      `;


      scores.forEach((s, index) => {

        const row =
          document.createElement('tr');


        row.innerHTML = `

          <td>${index + 1}</td>

          <td>${escapeHTML(s.name)}</td>

          <td>${s.score}</td>

          <td>${s.attempts}</td>

          <td>${s.time}s</td>

        `;


        table.appendChild(row);

      });


      leaderboardEl.appendChild(table);

    }


    /* =========================================
       SECURITY
    ========================================= */

    function escapeHTML(value) {

      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');

    }


    /* =========================================
       INITIALIZE
    ========================================= */

    startGame();

  </script>

</body>
</html>
